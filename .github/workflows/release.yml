name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

# Add permissions for the workflow
permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      platforms: ${{ steps.version.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag and package versions
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version" >&2
            exit 1
          fi
          if [[ "$package_version" != "$lock_version" ]]; then
            echo "package.json version $package_version does not match package-lock.json version $lock_version" >&2
            exit 1
          fi

          node -e 'const {execFileSync}=require("node:child_process"); const targets=JSON.parse(execFileSync(process.execPath,["scripts/release-targets.mjs"])); console.log("platforms="+JSON.stringify(targets.macos?["windows","macos"]:["windows"]))' >> "$GITHUB_OUTPUT"
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Require successful production promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          production_run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow production-promotion.yml \
            --commit "$GITHUB_SHA" \
            --event workflow_dispatch \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"

          if [[ -z "$production_run_id" ]]; then
            echo "No successful production promotion found for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "Using production promotion run $production_run_id"

      - name: Prepare shared release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PLATFORMS: ${{ steps.version.outputs.platforms }}
        run: |
          tag="v$RELEASE_VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Release $tag" --draft --generate-notes \
              --notes "Desktop installers and automatic updater files publish independently as each selected platform finishes. Platforms: $RELEASE_PLATFORMS. Existing downloads remain available until replaced."
          fi

  publish-platform:
    needs: validate-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate-release.outputs.platforms) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for this platform's exact-SHA candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/find-desktop-candidate.py "${{ matrix.platform }}"

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          path: release-artifacts/${{ matrix.platform }}-release
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}

      - name: Verify exact candidate artifacts before publishing
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: python3 scripts/verify-desktop-candidate.py release-artifacts "${{ matrix.platform }}"

      - name: Publish platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          case "${{ matrix.platform }}" in
            windows)
              files=("release-artifacts/windows-release/Prysm-Setup-$RELEASE_VERSION.exe"
                     "release-artifacts/windows-release/Prysm-Setup-$RELEASE_VERSION.exe.blockmap"
                     "release-artifacts/windows-release/latest.yml") ;;
            macos)
              files=("release-artifacts/macos-release/Prysm-mac-arm64-$RELEASE_VERSION.zip"
                     "release-artifacts/macos-release/latest-mac.yml") ;;
            *) exit 1 ;;
          esac
          gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
