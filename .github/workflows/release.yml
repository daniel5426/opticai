name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

# Add permissions for the workflow
permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate tag and package versions
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version" >&2
            exit 1
          fi
          if [[ "$package_version" != "$lock_version" ]]; then
            echo "package.json version $package_version does not match package-lock.json version $lock_version" >&2
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Require successful production promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          production_run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow production-promotion.yml \
            --commit "$GITHUB_SHA" \
            --event workflow_dispatch \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"

          if [[ -z "$production_run_id" ]]; then
            echo "No successful production promotion found for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "Using production promotion run $production_run_id"

  build-macos:
    needs: validate-release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci

      - name: Generate production environment file
        run: |
          cat > .env.production <<'EOF'
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          DOWNLOAD_PAGE_URL=${{ secrets.DOWNLOAD_PAGE_URL }}
          GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          EOF

      - name: Build for macOS Intel and Apple Silicon
        run: |
          npx vite build
          npx electron-builder --mac --x64 --arm64 --publish never
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  build-windows:
    needs: validate-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci

      - name: Set up native OptiTech reader toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel autoconf automake libtool bison flex pkgconf gawk
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-glib2 mingw-w64-x86_64-libiconv

      - name: Build native OptiTech reader
        shell: msys2 {0}
        run: bash scripts/build-optitech-reader.sh

      - name: Generate Windows production environment file
        shell: pwsh
        run: |
          @"
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          DOWNLOAD_PAGE_URL=${{ secrets.DOWNLOAD_PAGE_URL }}
          GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          "@ | Set-Content -Path .env.production -NoNewline

          Copy-Item -Path .env.production -Destination .env.windows.production

      - name: Build for Windows
        run: |
          npx vite build
          npx electron-builder --win --publish never
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify packaged native OptiTech reader
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem release -Filter "win-unpacked" -Directory -Recurse | Select-Object -First 1
          if (-not $unpacked) { throw "Windows unpacked application was not created" }
          $reader = Join-Path $unpacked.FullName "resources\optitech_reader\optitech-mdb-exporter.exe"
          $notice = Join-Path $unpacked.FullName "resources\optitech_reader\THIRD_PARTY_NOTICES.md"
          $license = Join-Path $unpacked.FullName "resources\optitech_reader\COPYING.LIB"
          $source = Join-Path $unpacked.FullName "resources\optitech_reader\SOURCE_AND_BUILD.md"
          if (-not (Test-Path $reader) -or -not (Test-Path $notice) -or -not (Test-Path $license) -or -not (Test-Path $source)) { throw "Native OptiTech reader resources are missing" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/Prysm-Setup-${{ needs.validate-release.outputs.version }}.exe
            release/Prysm-Setup-${{ needs.validate-release.outputs.version }}.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish-release:
    needs: [validate-release, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-release.outputs.version }}
          name: Release v${{ needs.validate-release.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## Release v${{ needs.validate-release.outputs.version }}

            ### Downloads
            - **macOS Apple Silicon**: `Prysm-mac-arm64-${{ needs.validate-release.outputs.version }}.zip`
            - **macOS Intel**: `Prysm-mac-x64-${{ needs.validate-release.outputs.version }}.zip`
            - **Windows**: `Prysm-Setup-${{ needs.validate-release.outputs.version }}.exe`

            ### Auto-Update Support
            This release includes update support. Windows builds can download and install updates in-app after the first manual install.

            ### Installation

            #### macOS
            1. Download the appropriate ZIP for your Mac.
            2. Extract the ZIP file.
            3. Move Prysm.app to your Applications folder.
            4. First time opening: right-click Prysm.app, then choose Open.

            #### Windows
            1. Download `Prysm-Setup-${{ needs.validate-release.outputs.version }}.exe`.
            2. Run the installer.
            3. Future updates can be downloaded and installed from inside the app.
          files: |
            release-artifacts/macos-release/*.zip
            release-artifacts/macos-release/latest-mac.yml
            release-artifacts/windows-release/Prysm-Setup-${{ needs.validate-release.outputs.version }}.exe
            release-artifacts/windows-release/Prysm-Setup-${{ needs.validate-release.outputs.version }}.exe.blockmap
            release-artifacts/windows-release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
