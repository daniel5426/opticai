name: Verify Staging and Build Windows

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full Git SHA to deploy and verify on Railway staging"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: staging-release
  cancel-in-progress: false

env:
  VITE_API_URL: https://staging-api.prysm.co.il/api/v1
  APP_ENVIRONMENT: staging
  APP_PROFILE_NAME: Prysm Staging
  AUTH_PROTOCOL: prysm-staging
  RAILWAY_PROJECT_ID: fb97ce50-fb72-4612-bfd1-c6d8a7bed9cb

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Validate requested commit
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full 40-character lowercase Git SHA is required" >&2
            exit 1
          fi
          if [[ "$checked_out_sha" != "$REQUESTED_SHA" ]]; then
            echo "Checked out $checked_out_sha instead of requested $REQUESTED_SHA" >&2
            exit 1
          fi
          if [[ "$DISPATCH_SHA" != "$REQUESTED_SHA" ]]; then
            echo "Workflow ref resolves to $DISPATCH_SHA, not requested $REQUESTED_SHA" >&2
            exit 1
          fi
          echo "sha=$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply public release dependency lock
        env:
          DEVDESK_RELEASE_BUILD: "1"
        run: node scripts/devdesk-release-inputs.mjs apply

      - name: Deploy exact candidate to staging in order
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          deploy_and_wait() {
            local service="$1"
            local message="Staging $service deploy $EXPECTED_SHA"
            local deployments deployment_id status

            railway up --detach --project "$RAILWAY_PROJECT_ID" \
              --environment staging --service "$service" --message "$message"

            for attempt in {1..90}; do
              deployments="$(railway deployment list \
                --service "$service" --environment staging --limit 20 --json)"
              deployment_id="$(jq -r --arg message "$message" \
                '[.[] | select(.meta.cliMessage == $message)][0].id // ""' <<<"$deployments")"
              status="$(jq -r --arg id "$deployment_id" \
                '[.[] | select(.id == $id)][0].status // "UNKNOWN"' <<<"$deployments")"
              echo "$service: deployment=${deployment_id:-pending} status=$status sha=$EXPECTED_SHA"
              case "$status" in
                SUCCESS) return 0 ;;
                FAILED|CRASHED|REMOVED|SKIPPED)
                  echo "$service failed to deploy the candidate: $status" >&2
                  return 1 ;;
              esac
              sleep 10
            done
            echo "$service did not finish deploying within fifteen minutes" >&2
            return 1
          }

          deploy_and_wait opticai
          curl --fail --silent --show-error --max-time 20 https://staging-api.prysm.co.il/health/database
          deploy_and_wait softoptic-migration-worker
          deploy_and_wait prysm-web-staging

      - name: Verify staging health
        shell: bash
        run: |
          retry_health() {
            local url="$1"
            for attempt in {1..18}; do
              if curl --fail --silent --show-error --max-time 20 "$url"; then
                echo
                return 0
              fi
              sleep 10
            done
            echo "Health check failed: $url" >&2
            return 1
          }

          retry_health https://staging-api.prysm.co.il/health
          retry_health https://staging-api.prysm.co.il/health/database
          retry_health https://prysm-web-staging-staging.up.railway.app/health

  build-windows-staging:
    needs: verify-staging
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply public release dependency lock
        env:
          DEVDESK_RELEASE_BUILD: "1"
        run: node scripts/devdesk-release-inputs.mjs apply

      - name: Install dependencies
        run: npm ci

      - name: Set up native OptiTech reader toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel autoconf automake libtool bison flex pkgconf gawk
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-glib2 mingw-w64-x86_64-libiconv

      - name: Build native OptiTech reader
        shell: msys2 {0}
        run: bash scripts/build-optitech-reader.sh

      - name: Generate staging environment files
        shell: pwsh
        run: |
          @"
          VITE_API_URL=${{ env.VITE_API_URL }}
          APP_ENVIRONMENT=${{ env.APP_ENVIRONMENT }}
          APP_PROFILE_NAME=${{ env.APP_PROFILE_NAME }}
          AUTH_PROTOCOL=${{ env.AUTH_PROTOCOL }}
          GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          "@ | Set-Content -Path .env.production -NoNewline

          @"
          VITE_API_URL=${{ env.VITE_API_URL }}
          APP_ENVIRONMENT=${{ env.APP_ENVIRONMENT }}
          APP_PROFILE_NAME=${{ env.APP_PROFILE_NAME }}
          AUTH_PROTOCOL=${{ env.AUTH_PROTOCOL }}
          GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          "@ | Set-Content -Path .env.windows.production -NoNewline

      - name: Build Windows staging app
        run: |
          npx vite build
          npx electron-builder --win nsis --x64 --publish never --config.productName="Prysm Staging" --config.appId="com.prysm.app.staging" '--config.nsis.artifactName=Prysm-Staging-Setup-${version}.${ext}'
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged native OptiTech reader
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem release -Filter "win-unpacked" -Directory -Recurse | Select-Object -First 1
          if (-not $unpacked) { throw "Windows unpacked application was not created" }
          $reader = Join-Path $unpacked.FullName "resources\optitech_reader\optitech-mdb-exporter.exe"
          $profiles = & $reader --profiles | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $profiles.opticplus_format_version -ne 2 -or $profiles.profiles -notcontains "opticplus") { throw "Packaged OpticPlus reader capability check failed" }
          $notice = Join-Path $unpacked.FullName "resources\optitech_reader\THIRD_PARTY_NOTICES.md"
          $license = Join-Path $unpacked.FullName "resources\optitech_reader\COPYING.LIB"
          $source = Join-Path $unpacked.FullName "resources\optitech_reader\SOURCE_AND_BUILD.md"
          if (-not (Test-Path $reader) -or -not (Test-Path $notice) -or -not (Test-Path $license) -or -not (Test-Path $source)) { throw "Native OptiTech reader resources are missing" }

      - name: Upload Windows staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: prysm-staging-windows-x64-${{ needs.verify-staging.outputs.sha }}
          path: release/Prysm-Staging-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

  publish-public-staging-download:
    needs: [verify-staging, build-windows-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Download staging artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging-artifacts

      - name: Publish public staging prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-${{ github.run_number }}
          name: Staging Build ${{ github.run_number }}
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Public staging build for testing.

            This is not a production release. The app installs as "Prysm Staging", uses the staging API, and has auto-update disabled.

            Verified commit: `${{ needs.verify-staging.outputs.sha }}`
          files: |
            staging-artifacts/prysm-staging-windows-x64-${{ needs.verify-staging.outputs.sha }}/Prysm-Staging-Setup-*.exe
