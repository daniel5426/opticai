name: Promote Tested Commit to Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full Git SHA verified by the staging release workflow"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: fb97ce50-fb72-4612-bfd1-c6d8a7bed9cb

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Validate requested commit and version
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full 40-character lowercase Git SHA is required" >&2
            exit 1
          fi
          if [[ "$checked_out_sha" != "$REQUESTED_SHA" ]]; then
            echo "Checked out $checked_out_sha instead of requested $REQUESTED_SHA" >&2
            exit 1
          fi
          if [[ "$DISPATCH_SHA" != "$REQUESTED_SHA" ]]; then
            echo "Workflow ref resolves to $DISPATCH_SHA, not requested $REQUESTED_SHA" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          if [[ "$package_version" != "$lock_version" ]]; then
            echo "package.json version $package_version does not match package-lock.json version $lock_version" >&2
            exit 1
          fi

          echo "sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Require successful staging verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          staging_run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow staging-electron.yml \
            --commit "$RELEASE_SHA" \
            --event workflow_dispatch \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"

          if [[ -z "$staging_run_id" ]]; then
            echo "No successful staging verification found for $RELEASE_SHA" >&2
            exit 1
          fi
          echo "Using staging verification run $staging_run_id"

      - name: Require successful exact-SHA backend and web CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for workflow in backend-railway.yml web-railway.yml; do
            passed=false
            for attempt in {1..90}; do
              run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "${{ inputs.sha }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              if [[ -n "$run" ]]; then
                echo "Using $workflow verification $run"
                passed=true
                break
              fi
              sleep 10
            done
            if [[ "$passed" != true ]]; then
              echo "No successful $workflow for ${{ inputs.sha }}" >&2
              exit 1
            fi
          done

  deploy-production:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply public release dependency lock
        env:
          DEVDESK_RELEASE_BUILD: "1"
        run: node scripts/devdesk-release-inputs.mjs apply

      - name: Prepare API desktop Calendar refresh credential
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          CALENDAR_RELEASE_ENVIRONMENT: production
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: python3 scripts/prepare_calendar_production_env.py --apply

      - name: Deploy API, worker, and web in order
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          deploy_and_wait() {
            local service="$1"
            local label="$2"
            local message="Production $label deploy $RELEASE_SHA"
            local deployments
            local deployment_id=""
            local status=""
            local -a source_args=()
            if [[ -n "${3:-}" ]]; then
              source_args=("$3" --path-as-root)
            fi

            railway up "${source_args[@]}" \
              --detach \
              --project "$RAILWAY_PROJECT_ID" \
              --environment production \
              --service "$service" \
              --message "$message"

            for attempt in {1..60}; do
              deployments="$(railway deployment list \
                --service "$service" \
                --environment production \
                --limit 20 \
                --json)"
              deployment_id="$(jq -r --arg message "$message" \
                '[.[] | select(.meta.cliMessage == $message)][0].id // ""' \
                <<<"$deployments")"

              if [[ -n "$deployment_id" ]]; then
                status="$(jq -r --arg id "$deployment_id" \
                  '.[] | select(.id == $id) | .status' \
                  <<<"$deployments")"
                echo "$service: deployment=$deployment_id status=$status"
                case "$status" in
                  SUCCESS|SKIPPED)
                    return 0
                    ;;
                  FAILED|CRASHED|REMOVED)
                    echo "$service production deployment failed with status $status" >&2
                    return 1
                    ;;
                esac
              else
                echo "$service: waiting for Railway to register the deployment"
              fi

              sleep 10
            done

            echo "$service production deployment did not finish within ten minutes" >&2
            return 1
          }

          retry_health() {
            local url="$1"
            for attempt in {1..18}; do
              if curl --fail --silent --show-error --max-time 20 "$url"; then
                echo
                return 0
              fi
              sleep 10
            done
            echo "Health check failed: $url" >&2
            return 1
          }

          deploy_and_wait opticai API
          retry_health https://api.prysm.co.il/health
          retry_health https://api.prysm.co.il/health/database

          # Use the verified backend source and the billing service's configured
          # command; the API's auto-detected manifest would start uvicorn instead.
          billing_source="$(mktemp -d)"
          git archive "$RELEASE_SHA" backend | tar -x -C "$billing_source"
          rm "$billing_source/backend/railway.json"
          deploy_and_wait allpay-billing-worker-production billing-worker "$billing_source" &
          billing_worker_pid=$!

          # Both consumers require the healthy migrated API, then deploy independently.
          (
            deploy_and_wait softoptic-migration-worker-Z2hA worker
            railway logs \
              --service softoptic-migration-worker-Z2hA \
              --environment production \
              --lines 30 \
              --json || true
          ) &
          migration_worker_pid=$!
          deploy_and_wait prysm-web web &
          web_pid=$!
          wait "$migration_worker_pid"
          wait "$web_pid"
          wait "$billing_worker_pid"
          rm -rf "$billing_source"

      - name: Record promoted release
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          {
            echo "## Production promotion complete"
            echo
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Desktop candidate version: \`$RELEASE_VERSION\`"
            echo "- API, database, worker, and web deployments succeeded or were safely skipped because their watched files were unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
