name: Optional Staging Desktop Build

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full Git SHA already auto-deployed to Railway staging"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: staging-release
  cancel-in-progress: false

env:
  VITE_API_URL: https://staging-api.prysm.co.il/api/v1
  APP_ENVIRONMENT: staging
  APP_PROFILE_NAME: Prysm Staging
  AUTH_PROTOCOL: prysm-staging
  RAILWAY_PROJECT_ID: fb97ce50-fb72-4612-bfd1-c6d8a7bed9cb

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          # The deployment watch check compares this commit with its parent.
          # actions/checkout otherwise fetches only the requested commit.
          fetch-depth: 2

      - name: Validate requested commit
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full 40-character lowercase Git SHA is required" >&2
            exit 1
          fi
          if [[ "$checked_out_sha" != "$REQUESTED_SHA" ]]; then
            echo "Checked out $checked_out_sha instead of requested $REQUESTED_SHA" >&2
            exit 1
          fi
          if [[ "$DISPATCH_SHA" != "$REQUESTED_SHA" ]]; then
            echo "Workflow ref resolves to $DISPATCH_SHA, not requested $REQUESTED_SHA" >&2
            exit 1
          fi
          echo "sha=$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Wait for Railway staging auto-deploys
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          wait_for_service() {
            local service="$1"
            shift
            local status
            local commit
            local deployments
            local watched_changed=true
            local successful_commit
            local checked_commit=""

            if git diff --quiet "$EXPECTED_SHA^" "$EXPECTED_SHA" -- "$@"; then
              watched_changed=false
              echo "$service: no watched files changed; checking the running successful revision"
            fi

            # Cold public-dependency installs plus image export can exceed five minutes.
            for attempt in {1..90}; do
              deployments="$(railway deployment list \
                --service "$service" \
                --environment staging \
                --limit 20 \
                --json)"
              status="$(jq -r --arg sha "$EXPECTED_SHA" '[.[] | select(.meta.commitHash == $sha)][0].status // "UNKNOWN"' <<<"$deployments")"
              commit="$EXPECTED_SHA"
              echo "$service: status=$status commit=${commit:-unknown}"

              if [[ "$commit" == "$EXPECTED_SHA" ]]; then
                case "$status" in
                  SUCCESS)
                    return 0
                    ;;
                  FAILED|CRASHED|REMOVED)
                    echo "$service staging deployment failed with status $status" >&2
                    return 1
                    ;;
                esac
              fi

              if [[ "$watched_changed" == false ]]; then
                successful_commit="$(jq -r '[.[] | select(.status == "SUCCESS")][0].meta.commitHash // ""' <<<"$deployments")"
                if [[ "$successful_commit" =~ ^[0-9a-f]{40}$ && "$successful_commit" != "$checked_commit" ]]; then
                  checked_commit="$successful_commit"
                  git cat-file -e "$successful_commit^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$successful_commit"
                  if git diff --quiet "$successful_commit" "$EXPECTED_SHA" -- "$@"; then
                    echo "$service: successful revision $successful_commit has identical watched files"
                    return 0
                  fi
                  echo "$service: successful revision $successful_commit is stale; waiting for the pending application deployment"
                fi
              fi

              sleep 10
            done

            echo "$service did not finish auto-deploying $EXPECTED_SHA within fifteen minutes" >&2
            return 1
          }

          wait_for_service opticai backend
          wait_for_service softoptic-migration-worker backend
          wait_for_service prysm-web-staging \
            src public index.html package.json package-lock.json vite.renderer.config.mts railway.json railpack.json config/devdesk-release config/desktop-runtime scripts/desktop-runtime.mjs scripts/devdesk-release-inputs.mjs scripts/serve-web.mjs

      - name: Verify staging health
        shell: bash
        run: |
          retry_health() {
            local url="$1"
            for attempt in {1..18}; do
              if curl --fail --silent --show-error --max-time 20 "$url"; then
                echo
                return 0
              fi
              sleep 10
            done
            echo "Health check failed: $url" >&2
            return 1
          }

          retry_health https://staging-api.prysm.co.il/health
          retry_health https://staging-api.prysm.co.il/health/database
          retry_health https://prysm-web-staging-staging.up.railway.app/health

  build-windows-staging:
    needs: verify-staging
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply public release dependency lock
        env:
          DEVDESK_RELEASE_BUILD: "1"
        run: node scripts/devdesk-release-inputs.mjs apply

      - name: Install dependencies
        run: npm ci

      - name: Restore or build verified native reader
        uses: ./.github/actions/optitech-reader

      - name: Generate staging environment files
        shell: pwsh
        run: |
          @"
          VITE_API_URL=${{ env.VITE_API_URL }}
          APP_ENVIRONMENT=${{ env.APP_ENVIRONMENT }}
          APP_PROFILE_NAME=${{ env.APP_PROFILE_NAME }}
          AUTH_PROTOCOL=${{ env.AUTH_PROTOCOL }}
          GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          "@ | Set-Content -Path .env.production -NoNewline

          @"
          VITE_API_URL=${{ env.VITE_API_URL }}
          APP_ENVIRONMENT=${{ env.APP_ENVIRONMENT }}
          APP_PROFILE_NAME=${{ env.APP_PROFILE_NAME }}
          AUTH_PROTOCOL=${{ env.AUTH_PROTOCOL }}
          GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          "@ | Set-Content -Path .env.windows.production -NoNewline

      - name: Build Windows staging app
        run: |
          npx vite build
          node scripts/prepare-desktop-app.mjs
          npx electron-builder --win nsis --x64 --publish never --config.productName="Prysm Staging" --config.appId="com.prysm.app.staging" '--config.nsis.artifactName=Prysm-Staging-Setup-${version}.${ext}'
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged native OptiTech reader
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem release -Filter "win-unpacked" -Directory -Recurse | Select-Object -First 1
          if (-not $unpacked) { throw "Windows unpacked application was not created" }
          $reader = Join-Path $unpacked.FullName "resources\optitech_reader\optitech-mdb-exporter.exe"
          $profiles = & $reader --profiles | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $profiles.opticplus_format_version -ne 2 -or $profiles.profiles -notcontains "opticplus") { throw "Packaged OpticPlus reader capability check failed" }
          $notice = Join-Path $unpacked.FullName "resources\optitech_reader\THIRD_PARTY_NOTICES.md"
          $license = Join-Path $unpacked.FullName "resources\optitech_reader\COPYING.LIB"
          $source = Join-Path $unpacked.FullName "resources\optitech_reader\SOURCE_AND_BUILD.md"
          if (-not (Test-Path $reader) -or -not (Test-Path $notice) -or -not (Test-Path $license) -or -not (Test-Path $source)) { throw "Native OptiTech reader resources are missing" }

      - name: Upload Windows staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: prysm-staging-windows-x64-${{ needs.verify-staging.outputs.sha }}
          path: release/Prysm-Staging-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-public-staging-download:
    needs: [verify-staging, build-windows-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Download staging artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging-artifacts

      - name: Publish public staging prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-${{ github.run_number }}
          name: Staging Build ${{ github.run_number }}
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Public staging build for testing.

            This is not a production release. The app installs as "Prysm Staging", uses the staging API, and has auto-update disabled.

            Verified commit: `${{ needs.verify-staging.outputs.sha }}`
          files: |
            staging-artifacts/prysm-staging-windows-x64-${{ needs.verify-staging.outputs.sha }}/Prysm-Staging-Setup-*.exe
