name: Web CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: web-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate public release inputs
        run: node scripts/devdesk-check.mjs --release --lock-only

      - name: Test change selection
        run: node scripts/devdesk-check.mjs --selection-test

      - name: Apply public release dependency lock
        run: DEVDESK_RELEASE_BUILD=1 node scripts/devdesk-release-inputs.mjs apply

      - name: Install dependencies
        run: npm ci

      - name: Test web
        run: npm test -- --run

      - name: Build web
        run: npm run build:web
