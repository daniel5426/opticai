name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-railway.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-railway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run backend release-gate tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: >
          python -m pytest
          backend/tests/test_production_hardening.py
          backend/tests/test_files_api.py
          backend/tests/test_default_exam_layout_seeds.py
          backend/tests/test_migration_helpers.py
          backend/tests/test_softoptic_migration_service.py
