schema: agents24.rag/v1
name: Prysm Speech Intake
description: Transcribe staff voice and supplier recordings with source evidence.
mode: ingestion
steps:
  source:
    uses: file_source
    with:
      ingestion_type: managed_file_batches
      batch_size: 1
  transcribe:
    uses: speech_to_text
    with:
      model_id: $models.speech
      transcription_mode: transcript_only
  chunk:
    uses: chunker
    with:
      strategy: structure
      chunk_size: 512
      chunk_overlap: 50
  embed:
    uses: model_embedder
    with:
      model_id: $models.embedding
  store:
    uses: knowledge_store_sink
    with:
      knowledge_store_id: ../stores/documents.yaml
      namespace_dynamic: true
flow:
  - from: source
    to: transcribe
  - from: transcribe
    to: chunk
  - from: chunk
    to: embed
  - from: embed
    to: store
