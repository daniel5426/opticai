schema: agents24.workflow/v1
name: Prysm Clinic Agent
description: Clinic search and reports with native document, screenshot and voice processing.
inputs:
  text:
    type: string
    semantic_type: text
    enabled: true
    required: false
  files:
    type: list
    semantic_type: files
    enabled: true
    required: false
  images:
    type: list
    semantic_type: images
    enabled: true
    required: false
  audio:
    type: list
    semantic_type: audio
    enabled: true
    required: false
outputs:
  response: string
start:
  attachment_retention:
    mode: duration
    seconds: 18000
entry: document_extract
nodes:
  speech_to_text:
    type: speech_to_text
    with:
      model_id: $models.speech
      mime_types:
        - audio/wav
        - audio/mpeg
        - audio/webm
        - audio/mp4
      input_sources:
        - id: audio
          value_ref:
            namespace: workflow_input
            key: audio
  document_extract:
    type: document_extract
    with:
      mime_types:
        - text/plain
        - text/markdown
        - text/csv
        - application/json
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      input_sources:
        - id: files
          value_ref:
            namespace: workflow_input
            key: files
  ocr:
    type: ocr
    with:
      model_id: $models.ocr
      mime_types:
        - application/pdf
        - image/png
        - image/jpeg
        - image/webp
      input_sources:
        - id: files
          value_ref:
            namespace: workflow_input
            key: files
        - id: images
          value_ref:
            namespace: workflow_input
            key: images
  assistant:
    uses: ../agents/assistant.md
    inputs:
      - text
      - from: document_extract.text
        label: Document contents
      - from: ocr.text
        label: Screenshot and scanned document contents
      - from: speech_to_text.text
        label: Voice message
flow:
  - from: start
    to: speech_to_text
  - from: start
    to: ocr
  - from: document_extract
    to: assistant
  - from: ocr
    to: assistant
  - from: speech_to_text
    to: assistant
  - from: assistant.output_text
    to: output.response
